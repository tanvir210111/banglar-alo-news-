<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F2B48" />
    </linearGradient>
    <linearGradient id="sideBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="sideGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="250" rx="8" fill="url(#sideBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Badges -->
  <g transform="translate(14, 14)">
    <rect x="0" y="0" width="70" height="20" rx="10" fill="#DC2626" />
    <circle cx="10" cy="10" r="3.5" fill="#FEF08A">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="14" font-family="system-ui, sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF" letter-spacing="0.5">SPONSOR</text>
  </g>

  <g transform="translate(195, 14)">
    <rect x="0" y="0" width="90" height="20" rx="4" fill="#087A43" opacity="0.3" stroke="#10B981" stroke-width="0.8" />
    <text x="45" y="14" text-anchor="middle" font-family="'SolaimanLipi', sans-serif" font-size="10" font-weight="700" fill="#34D399">২৪/৭ সাপোর্ট</text>
  </g>

  <!-- Brand Name -->
  <text x="150" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">
    Banglar Alo IT
  </text>
  <text x="150" y="80" text-anchor="middle" font-family="'SolaimanLipi', sans-serif" font-weight="700" font-size="13" fill="#FCD34D">
    ব্যবসার প্রসারে বিশ্বমানের আইটি সেবা
  </text>

  <!-- Checklist Features -->
  <g transform="translate(24, 98)" font-family="'SolaimanLipi', sans-serif" font-size="11.5" fill="#E2E8F0">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="4" r="5" fill="#10B981" />
      <text x="5" y="7" text-anchor="middle" font-size="8" fill="#FFFFFF">✓</text>
      <text x="18" y="8">নিউজ পোর্টাল ও ডায়নামিক ওয়েবসাইট</text>
    </g>
    <g transform="translate(0, 20)">
      <circle cx="6" cy="4" r="5" fill="#10B981" />
      <text x="5" y="7" text-anchor="middle" font-size="8" fill="#FFFFFF">✓</text>
      <text x="18" y="8">অ্যান্ড্রয়েড ও আইওএস মোবাইল অ্যাপ</text>
    </g>
    <g transform="translate(0, 40)">
      <circle cx="6" cy="4" r="5" fill="#10B981" />
      <text x="5" y="7" text-anchor="middle" font-size="8" fill="#FFFFFF">✓</text>
      <text x="18" y="8">সুপারফাস্ট NVMe ক্লাউড হোস্টিং</text>
    </g>
  </g>

  <!-- Call to action button -->
  <g transform="translate(25, 178)">
    <rect x="0" y="0" width="250" height="38" rx="6" fill="url(#sideBtnGrad)" filter="url(#sideGlow)" />
    <text x="125" y="24" text-anchor="middle" font-family="'SolaimanLipi', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">
      বিস্তারিত ও অর্ডার করুন ➜
    </text>
  </g>

  <!-- Footer Link -->
  <text x="150" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">
    www.banglaraloit.com
  </text>
</svg>
