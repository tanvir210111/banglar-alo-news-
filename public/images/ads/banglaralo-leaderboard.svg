<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="50%" stop-color="#112240" />
      <stop offset="100%" stop-color="#0F2B48" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087A43" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }
      @keyframes shimmer { 0% { stop-color: #087A43; } 50% { stop-color: #059669; } 100% { stop-color: #087A43; } }
      .live-dot { animation: pulseDot 1.5s infinite; transform-origin: 42px 32px; }
      .brand-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 26px; fill: #FFFFFF; }
      .bangla-headline { font-family: 'SolaimanLipi', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #FCD34D; }
      .subtext { font-family: 'SolaimanLipi', system-ui, sans-serif; font-size: 13px; fill: #94A3B8; }
      .btn-text { font-family: 'SolaimanLipi', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #FFFFFF; }
      .badge-text { font-family: system-ui, sans-serif; font-weight: 800; font-size: 11px; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="970" height="120" rx="8" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="1.5" />

  <!-- Decorative Tech Grid & Circles -->
  <circle cx="850" cy="60" r="90" fill="#06B6D4" opacity="0.06" filter="url(#glow)" />
  <circle cx="120" cy="60" r="70" fill="#10B981" opacity="0.05" />

  <!-- Left Side: Live Badge -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="#DC2626" />
    <circle class="live-dot" cx="14" cy="12" r="4.5" fill="#FEF08A" />
    <text x="25" y="16" class="badge-text" letter-spacing="1">LIVE AD</text>
  </g>

  <!-- Brand Identity -->
  <g transform="translate(118, 38)">
    <text x="0" y="0" class="brand-title">Banglar Alo IT <tspan fill="#38BDF8" font-size="20">.tech</tspan></text>
    <text x="0" y="26" class="bangla-headline">আধুনিক নিউজ পোর্টাল, ওয়েবসাইট ও মোবাইল অ্যাপ তৈরি করুন</text>
    <text x="0" y="48" class="subtext">ডোমেইন • ক্লাউড হোস্টিং • সফটওয়্যার সলিউশন • এসইও ও ডিজিটাল মার্কেটিং • ২৪/৭ সাপোর্ট</text>
  </g>

  <!-- Right Side Offer & Button -->
  <g transform="translate(740, 25)">
    <!-- Discount pill -->
    <rect x="30" y="2" width="160" height="24" rx="6" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="1" />
    <text x="110" y="18" text-anchor="middle" font-family="'SolaimanLipi', sans-serif" font-weight="700" font-size="12" fill="#FCD34D">★ ৫০% পর্যন্ত বিশেষ ছাড় ★</text>

    <!-- Call to action button -->
    <g transform="translate(30, 36)">
      <rect x="0" y="0" width="160" height="40" rx="6" fill="url(#btnGrad)" filter="url(#glow)" />
      <text x="80" y="25" text-anchor="middle" class="btn-text">অর্ডার করুন ➜</text>
    </g>
  </g>
</svg>
