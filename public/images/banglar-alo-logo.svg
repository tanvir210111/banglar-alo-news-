<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Transparent Background SVG Icon -->
  <!-- 8 radiating green rays (#009A49) -->
  <g stroke="#009A49" stroke-width="4" stroke-linecap="round">
    <!-- Top & Bottom (vertical) -->
    <line x1="50" y1="10" x2="50" y2="22" />
    <line x1="50" y1="78" x2="50" y2="90" />
    
    <!-- Left & Right (horizontal) -->
    <line x1="10" y1="50" x2="22" y2="50" />
    <line x1="78" y1="50" x2="90" y2="50" />
    
    <!-- Diagonals (45 degree angles) -->
    <line x1="21.7" y1="21.7" x2="30.2" y2="30.2" />
    <line x1="78.3" y1="21.7" x2="69.8" y2="30.2" />
    <line x1="21.7" y1="78.3" x2="30.2" y2="69.8" />
    <line x1="78.3" y1="78.3" x2="69.8" y2="69.8" />
  </g>
  
  <!-- Crimson Red Sun Core (#EF1D26) -->
  <circle cx="50" cy="50" r="24" fill="#EF1D26" />
</svg>
