<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#045A30" />
    </linearGradient>
    <linearGradient id="sunburst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <g transform="translate(400, 210) scale(1.6)">
    <g transform="translate(-50, -50)">
      <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#0B7A43" stroke-width="2" />
      <circle cx="50" cy="50" r="44" fill="url(#greenBadge)" />
      <!-- Radiant sunbeams -->
      <g stroke="url(#sunburst)" stroke-width="2" stroke-linecap="round">
        <line x1="50" y1="18" x2="50" y2="24" />
        <line x1="34" y1="23" x2="39" y2="28" />
        <line x1="66" y1="23" x2="61" y2="28" />
        <line x1="22" y1="36" x2="28" y2="40" />
        <line x1="78" y1="36" x2="72" y2="40" />
      </g>
      <!-- Stylized flame / torch / light -->
      <path d="M 50 26 C 44 35 43 42 46 48 C 47.5 50.5 52.5 50.5 54 48 C 57 42 56 35 50 26 Z" fill="url(#sunburst)" />
      <circle cx="50" cy="24" r="2" fill="#FFFFFF" />
      <!-- Base wings -->
      <path d="M 28 66 Q 38 60 50 63 Q 62 60 72 66 L 70 73 Q 60 68 50 71 Q 40 68 30 73 Z" fill="#FFFFFF" />
    </g>
  </g>
  <text x="400" y="335" text-anchor="middle" font-family="'Noto Sans Bengali', system-ui, sans-serif" font-size="26" font-weight="bold" fill="#0B7A43">
    বাংলার আলো নিউজ
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B">
